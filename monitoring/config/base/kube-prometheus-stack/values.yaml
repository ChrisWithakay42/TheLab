grafana:
  enabled: true
  
  admin:
    existingSecret: "grafana-oidc-secret"
    passwordKey: "GRAFANA_ADMIN_PASSWORD"
    
  ingress:
    enabled: false 

  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    finalizers:
      - kubernetes.io/pvc-protection

  envFromSecret: grafana-oidc-secret

  grafana.ini:
    server:
      root_url: "https://grafana.lab42.codewithakay.dev"
    
    auth.generic_oauth:
      enabled: true
      name: "authentik"
      allow_sign_up: true
      
      client_id: "$__env{OAUTH_CLIENT_ID}"
      client_secret: "$__env{OAUTH_CLIENT_SECRET}"
      scopes: "openid profile email groups"
      
      auth_url: "https://auth.lab42.codewithakay.dev/application/o/authorize/"
      token_url: "https://auth.lab42.codewithakay.dev/application/o/token/"
      api_url: "https://auth.lab42.codewithakay.dev/application/o/userinfo/"
      
      role_attribute_path: "contains(groups, 'authentik Admins') && 'Admin' || 'Viewer'"
      role_attribute_strict: false
      allow_assign_grafana_admin: true
    security:
      allow_embedding: true
      cookie_samesite: none
      cookie_secure: true
    auth.anonymous:
      enabled: false

  additionalDataSources:
  - name: Loki
    type: loki
    url: http://loki.monitoring.svc.cluster.local:3100
    access: proxy

prometheus:
  ingress:
    enabled: false
  prometheusSpec:
    retention: 7d
    retentionSize: 6GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    walCompression: true
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    
    startupProbe:
      failureThreshold: 60
      periodSeconds: 10

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  ingress:
    enabled: false
  alertmanagerSpec:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

kube-state-metrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
