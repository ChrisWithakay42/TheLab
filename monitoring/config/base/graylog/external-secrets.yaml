apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: graylog-secret
  namespace: graylog
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: graylog-secret
    creationPolicy: Owner
  data:
    # MongoDB connection URI using the mongo service in graylog-db namespace
    - secretKey: GRAYLOG_MONGODB_URI
      remoteRef:
        key: kubernetes/graylog
        property: GRAYLOG_MONGODB_URI

    # SHA256 hashed admin password for Graylog
    - secretKey: GRAYLOG_ROOT_PASSWORD_SHA2
      remoteRef:
        key: kubernetes/graylog
        property: GRAYLOG_ROOT_PASSWORD_SHA2

    # Secret salt string (at least 16 characters)
    - secretKey: GRAYLOG_PASSWORD_SECRET
      remoteRef:
        key: kubernetes/graylog
        property: GRAYLOG_PASSWORD_SECRET
