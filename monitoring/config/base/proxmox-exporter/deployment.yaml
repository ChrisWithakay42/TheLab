apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxmox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: proxmox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proxmox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxmox-exporter
    spec:
      containers:
        - name: exporter
          image: prompve/prometheus-pve-exporter:v3.5.2
          args:
            - "--config.file=/etc/pve/pve.yml"
          ports:
            - name: http
              containerPort: 9221
          env:
            - name: PVE_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: proxmox-exporter-secret
                  key: PVE_TOKEN_VALUE
          volumeMounts:
            - name: config
              mountPath: /etc/pve
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: proxmox-exporter-config
