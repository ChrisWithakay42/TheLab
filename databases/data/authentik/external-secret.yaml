apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgbouncer-secret
  namespace: authentik
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secret-store
    kind: ClusterSecretStore
  target:
    name: pgbouncer-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: homelab/kubernetes/authentik
        property: POSTGRESQL_HOST
    - secretKey: DB_USER
      remoteRef:
        key: homelab/kubernetes/authentik
        property: POSTGRESQL_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: homelab/kubernetes/authentik
        property: POSTGRESQL_PASSWORD
    - secretKey: DB_NAME
      remoteRef:
        key: homelab/kubernetes/authentik
        property: POSTGRESQL_NAME
