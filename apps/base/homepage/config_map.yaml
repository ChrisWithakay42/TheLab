apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  proxmox.yaml: |
    url: https://192.168.20.30:8006
    username: "{{HOMEPAGE_VAR_PVE_USER}}"
    password: "{{HOMEPAGE_VAR_PVE_PASS}}"
    verifySsl: false

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: ""

  settings.yaml: |
    serviceDiscovery:
      ingress: false
    providers:
      longhorn:
        url: https://cwk.longhorn
    maxGroupColumns: 4
    useEqualHeights: true
    cardBlur: md
    background:
      image: "http://192.168.20.20:9000/homepage-wallpapers/hacker-hacking-3840x2160-15637.jpeg"
      brightness: 40
      blur: 2

    layout:
      System:
        style: row
        columns: 2
      Network & Security:
        style: row
        columns: 2
      Identity & Access:
        style: row
        columns: 2
      Storage & Data:
        style: row
        columns: 2
      Gateways:
        style: row
        columns: 2
      Observability & Automation:
        style: row
        columns: 2
      Sidebar:
        style: column
        columns: 1

  custom.css: |
    /* --- Cyberpunk / Glassmorphism Theme --- */
    :root {
      --glass-bg: rgba(14, 16, 24, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent-glow: rgba(0, 220, 130, 0.4);
    }

    #layout-groups {
      gap: 1rem !important;
      align-items: stretch !important; /* overrides Tailwind's items-start, which was the actual cause */
    }

    @media (min-width: 1280px) {
      #layout-groups > .services-group:not(.drawer-group) {
        flex: 0 1 calc((100% - 2rem) / 3) !important;
        max-width: calc((100% - 2rem) / 3) !important;
      }
    }

    @media (min-width: 768px) and (max-width: 1279px) {
      #layout-groups > .services-group:not(.drawer-group) {
        flex: 0 1 calc((100% - 1rem) / 2) !important;
        max-width: calc((100% - 1rem) / 2) !important;
      }
    }

    /* Glass Cards */
    .service-card, .widget-card {
      background-color: var(--glass-bg) !important;
      backdrop-filter: blur(14px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(14px) saturate(180%) !important;
      border: 1px solid var(--glass-border) !important;
      border-radius: 10px !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
      break-inside: avoid !important; /* stop cards splitting across CSS columns */
    }

    .service-card:hover, .widget-card:hover {
      border-color: var(--accent-glow) !important;
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.7), 0 0 10px 0 rgba(0, 220, 130, 0.2);
      transform: translateY(-2px);
    }

    /* Category Group Headers */
    .group-title {
      font-size: 0.8rem !important;
      font-weight: 800 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.12em !important;
      color: rgba(220, 230, 240, 0.9) !important;
      margin-bottom: 0.5rem !important;
    }

    /* Stat Badges / Metrics */
    .widget-stat {
      background-color: rgba(0, 0, 0, 0.4) !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      border-radius: 5px !important;
      font-weight: 600 !important;
    }

    /* Prevent stat labels like "WAN DOWNLOAD" from breaking mid-word
       (was rendering as "WA" / "N DOWN" on narrow OPNsense-style cards) */
    .service-block,
    .widget-stat {
      word-break: keep-all !important;
      overflow-wrap: normal !important;
      white-space: normal !important;
      min-width: 0;
    }

    html, body {
      overflow-x: hidden;
    }

    /* Fix density for 14" screen so it doesn't scroll off bottom */
    @media (max-width: 1600px) {
      .service-card {
        padding: 0.6rem 0.75rem !important;
      }
      .service-card .service-title {
        font-size: 0.82rem !important;
        font-weight: 600;
      }
      .service-card .service-description {
        font-size: 0.68rem !important;
        opacity: 0.65;
      }
      .widget-stat {
        padding: 0.15rem 0.3rem !important;
        font-size: 0.68rem !important;
      }
    }

    /* --- Off-canvas Sidebar Drawer ---
       .drawer-group is applied by custom.js to whichever .services-group
       has the title "Sidebar". #sidebar-backdrop and #sidebar-toggle are
       also created by custom.js. */
    .drawer-group {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 320px;
      max-width: 85vw;
      margin: 0 !important;
      padding: 1rem;
      overflow-y: auto;
      z-index: 60;
      background: var(--glass-bg);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-left: 1px solid var(--glass-border);
      transform: translateX(100%) !important;
      transition: transform 0.3s ease;
    }

    body.sidebar-open .drawer-group {
      transform: translateX(0) !important;
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.5);
    }

    #sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: transparent; /* was rgba(0,0,0,0.5) — no more dimming */
      pointer-events: none;
      z-index: 55;
    }

    body.sidebar-open #sidebar-backdrop {
      pointer-events: auto; /* still catches the click-outside-to-close */
    }

    #sidebar-toggle {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      z-index: 61;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-right: none;
      border-radius: 8px 0 0 8px;
      padding: 0.75rem 0.4rem;
      cursor: pointer;
      color: rgba(220, 230, 240, 0.9);
      writing-mode: vertical-rl;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: right 0.3s ease;
    }

    body.sidebar-open #sidebar-toggle {
      right: 320px;
    }

  custom.js: |
    (function () {
      // === 1. Sidebar Drawer Logic ===
      function findSidebarGroup() {
        var container = document.getElementById('layout-groups');
        if (!container) return null;
        for (var i = 0; i < container.children.length; i++) {
          if (container.children[i].textContent.trim().indexOf('Sidebar') === 0) {
            return container.children[i];
          }
        }
        return null;
      }

      function initSidebar() {
        var sidebar = findSidebarGroup();
        if (!sidebar) return false;

        if (sidebar.parentElement !== document.body) {
          document.body.appendChild(sidebar);
        }

        sidebar.classList.add('drawer-group');

        if (!document.getElementById('sidebar-backdrop')) {
          var backdrop = document.createElement('div');
          backdrop.id = 'sidebar-backdrop';
          backdrop.addEventListener('click', function () {
            document.body.classList.remove('sidebar-open');
          });
          document.body.appendChild(backdrop);
        }

        if (!document.getElementById('sidebar-toggle')) {
          var toggle = document.createElement('div');
          toggle.id = 'sidebar-toggle';
          toggle.textContent = 'Sidebar';
          toggle.addEventListener('click', function () {
            document.body.classList.toggle('sidebar-open');
          });
          document.body.appendChild(toggle);
        }
        return true;
      }

      // Run sidebar initializer until it finds it, then stop this specific loop
      var sidebarTries = 0;
      var sidebarInterval = setInterval(function () {
        sidebarTries++;
        if (initSidebar() || sidebarTries > 20) {
          clearInterval(sidebarInterval);
        }
      }, 250);


      // === 2. Label Shortening Logic (FIXED) ===
      var LABEL_MAP = {
        'wan upload': 'UP',
        'wan download': 'DOWN',
        'active memory': 'MEM',
        'memory': 'MEM',
        'cpu load': 'CPU'
      };

      function shortenLabels() {
        // Target elements that hold text in Homepage
        var elements = document.querySelectorAll('div, span, p');
        for (var i = 0; i < elements.length; i++) {
          var el = elements[i];
          
          // el.children.length === 0 ensures we only modify the deepest level text wrappers.
          // This stops us from accidentally deleting sibling stat values or icons.
          if (el.children.length === 0 && el.textContent) {
            var text = el.textContent.trim().toLowerCase();
            
            // If the text matches our map, AND it hasn't already been changed
            if (LABEL_MAP[text] && el.textContent !== LABEL_MAP[text]) {
              el.textContent = LABEL_MAP[text];
            }
          }
        }
      }

      // Instead of an observer (which fights with React), we run a continuous 
      // 1-second polling interval. It takes effectively 0 processing power 
      // but ensures slow API fetches from OPNsense are instantly caught.
      setInterval(shortenLabels, 1000);
      shortenLabels(); // Run once immediately
    })();

  bookmarks.yaml: |
    - Developer:
        - GitLab:
            - abbr: GL
              href: https://gitlab.com/
        - GitHub:
            - abbr: GH
              href: https://github.com/
    - Documentation:
        - Homepage:
            - abbr: HP
              href: https://gethomepage.dev/
        - Kubernetes:
            - abbr: K8s
              href: https://kubernetes.io/docs/

  services.yaml: |
    # === ROW 1 ===
    - System:
        - Proxmox VE:
            href: https://192.168.20.30:8006/
            description: Hypervisor Cluster
            icon: proxmox.svg
            widget:
              type: proxmox
              url: https://192.168.20.30:8006
              username: "{{HOMEPAGE_VAR_PVE_USER}}"
              password: "{{HOMEPAGE_VAR_PVE_PASS}}"
              verifySsl: false
        - OMV:
            href: http://192.168.20.20
            description: OpenMediaVault NAS
            icon: openmediavault.svg
            widget:
              type: openmediavault
              url: http://192.168.20.20
              username: "{{HOMEPAGE_VAR_OMV_USER}}"
              password: "{{HOMEPAGE_VAR_OMV_PASS}}"
              method: services.getStatus

    - Network & Security:
        - OPNSense:
            href: https://192.168.10.1
            description: Gateway Firewall
            icon: opnsense.svg
            widget:
              type: opnsense
              url: https://192.168.10.1
              username: "{{HOMEPAGE_VAR_OPNSENSE_KEY}}"
              password: "{{HOMEPAGE_VAR_OPNSENSE_SECRET}}"
              verifySsl: false
              fields: ["cpu", "memory", "wanUpload", "wanDownload"]
        - Unifi:
            href: https://192.168.30.10:8443/
            description: Network Controller
            icon: unifi.svg
            widget:
              type: unifi
              url: https://192.168.30.10:8443
              site: HomeLab
              username: "{{HOMEPAGE_VAR_UNIFI_USER}}"
              password: "{{HOMEPAGE_VAR_UNIFI_PASS}}"

    - Identity & Access:
        - Authentik:
            href: https://auth.lab42.codewithakay.dev
            description: Identity & SSO Provider
            icon: authentik.svg
            widget:
              type: authentik
              url: http://authentik-server.authentik.svc.cluster.local:9000
              key: "{{HOMEPAGE_VAR_AUTHENTIK_KEY}}"
        - Netbox:
            href: http://192.168.10.50:8000
            description: DCIM & IPAM Source
            icon: netbox.svg
            ping: http://192.168.10.50:8000/api/

    # === ROW 2 ===
    - Storage & Data:
        - MinIO:
            href: http://192.168.20.20:9001
            description: S3 Object Storage
            icon: minio.svg
            ping: http://minio.storage.svc.cluster.local:9000/minio/health/live
        - Longhorn:
            href: http://cwk.longhorn/
            description: K8s CSI Block Storage
            icon: longhorn.svg
            ping: http://longhorn-frontend.longhorn-system.svc.cluster.local:80/
        - pgAdmin:
            href: http://cwk.pgadmin/
            description: Postgres Admin
            icon: pgadmin.svg
            ping: http://pgadmin.databases.svc.cluster.local:80/misc/ping

    - Gateways:
        - Pi-hole:
            href: http://192.168.30.5/admin/
            description: DNS & Ad Blocking
            icon: pi-hole.svg
            widget:
              type: pihole
              url: http://192.168.30.5
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_WEBPASSWORD}}"
        - Cloudflare:
            href: https://dash.cloudflare.com/
            description: Zero Trust Tunnel
            icon: cloudflare.svg
            widget:
              type: cloudflared
              accountid: "{{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID}}"
              tunnelid: "{{HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID}}"
              key: "{{HOMEPAGE_VAR_CLOUDFLARE_TOKEN}}"

    - Observability & Automation:
        - Grafana:
            href: http://cwk.grafana/
            description: Metrics & Dashboards
            icon: grafana.svg
            widget:
              type: grafana
              url: http://grafana.monitoring.svc.cluster.local:3000
              username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASS}}"
        - Graylog:
            href: http://cwk.graylog/
            description: Log Management
            icon: graylog.svg
            ping: http://graylog.logging.svc.cluster.local:9000/
        - n8n:
            href: http://cwk.n8n/
            description: Workflow Automation
            icon: n8n.svg
            ping: http://n8n.automation.svc.cluster.local:5678/healthz
        - Wallabag:
            href: http://cwk.wallabag
            description: Archival & Reading
            icon: wallabag.svg
            ping: http://wallabag.apps.svc.cluster.local:80/

    # === SIDEBAR (off-canvas drawer, see custom.css / custom.js) ===
    - Sidebar:
        - Calendar:
            icon: mdi-calendar
            widget:
              type: calendar
              view: agenda # monthly grid isn't clickable — this lists events directly instead
              maxEvents: 10
              showTime: true
              integrations:
                - type: ical
                  name: "My Calendar"
                  url: "{{HOMEPAGE_VAR_ICAL_URL}}"
                  color: teal
        - Weather:
            icon: mdi-weather-partly-cloudy
            widget:
              type: customapi
              url: https://api.open-meteo.com/v1/forecast?latitude=51.5074&longitude=-0.1278&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Europe%2FLondon
              refreshInterval: 600000
              mappings:
                - field: current.temperature_2m
                  label: temperature.now
                  format: text
                - field: daily.temperature_2m_max.0
                  label: temperature.max
                  format: text

  widgets.yaml: |
    # Everything in this file renders as small items in ONE row at the very
    # top of the page (next to the search bar) — that's a hard constraint of
    # how gethomepage's "info widgets" work. Weather CANNOT become a grid
    # card this way — the big Weather card is instead the `customapi`
    # service widget in the Sidebar group in services.yaml above.

    - search:
        provider: duckduckgo
        target: _blank

    - openmeteo:
        label: Local
        latitude: 51.5074
        longitude: -0.1278
        timezone: Europe/London
        units: metric

    - datetime:
        format:
          timeStyle: short
          dateStyle: short

    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Cluster"
        nodes:
          show: true
