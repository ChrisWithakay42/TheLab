apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-secret
  namespace: karakeep
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secret-store
    kind: ClusterSecretStore
  target:
    name: karakeep-secret
    creationPolicy: Owner
    template:
      data:
        # Mandatory NextAuth secret for session encryption
        NEXTAUTH_SECRET: "{{ .NEXTAUTH_SECRET }}"
        # public URL for Karakeep
        NEXTAUTH_URL: "{{ .NEXTAUTH_URL }}"

        # (Optional) If using Meilisearch for full-text search
        # MEILI_MASTER_KEY: "{{ .MEILI_MASTER_KEY }}"

        # (Optional) If using OpenAI / Ollama for automatic tagging
        # OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: homelab/kubernetes/karakeep
        property: NEXTAUTH_SECRET
    - secretKey: NEXTAUTH_URL
      remoteRef:
        key: homelab/kubernetes/karakeep
        property: NEXTAUTH_URL

    # (Optional)
    # - secretKey: MEILI_MASTER_KEY
    #   remoteRef:
    #     key: homelab/kubernetes/karakeep
    #     property: MEILI_MASTER_KEY
