apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-secret
  namespace: karakeep
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secret-store
    kind: ClusterSecretStore
  target:
    name: karakeep-secret
    creationPolicy: Owner
    template:
      data:
        KK_DATABASE_URL: "postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASSWORD }}@postgres.karakeep-db.svc.cluster.local:5432/{{ .POSTGRES_DB }}"
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: homelab/kubernetes/karakeep-db
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: homelab/kubernetes/karakeep-db
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: homelab/kubernetes/karakeep-db
        property: POSTGRES_DB
