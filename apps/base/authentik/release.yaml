apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 5m
  chart:
    spec:
      chart: authentik
      version: '2026.8.0' 
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  values:
    authentik:
      error_reporting:
        enabled: true

    postgresql:
      enabled: false 
    redis:
      enabled: false

    global:
      envFrom:
        - secretRef:
            name: authentik-secret

    server:
      env:
        - name: AUTHENTIK_REDIS__TLS
          value: "true"
        - name: AUTHENTIK_POSTGRESQL__OPTIONS__SSLMODE
          value: "disable"
        - name: AUTHENTIK_POSTGRESQL__DISABLE_SERVER_SIDE_CURSORS
          value: "true"

    # worker:
    #   env:
    #     - name: AUTHENTIK_REDIS__TLS
    #       value: "true"
    #     - name: AUTHENTIK_POSTGRESQL__OPTIONS__SSLMODE
    #       value: "disable"
