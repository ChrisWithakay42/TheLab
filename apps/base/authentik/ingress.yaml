apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-ingress
  namespace: authentik
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - auth.lab42.codewithakay.dev
      secretName: authentik-staging-tls-cert
  rules:
    - host: auth.lab42.codewithakay.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 80
