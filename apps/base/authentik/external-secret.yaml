apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret
  namespace: authentik
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secret-store
    kind: ClusterSecretStore
  target:
    name: authentik-secret
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: homelab/kubernetes/authentik
        property: AUTHENTIK_SECRET_KEY
        
    - secretKey: POSTGRESQL_HOST
      remoteRef:
        key: homelab/kubernetes/authentik
        property: POSTGRESQL_HOST
    - secretKey: POSTGRESQL_PORT
      remoteRef:
        key: homelab/kubernetes/authentik
        property: POSTGRESQL_PORT
    - secretKey: POSTGRESQL_USER
      remoteRef:
        key: homelab/kubernetes/authentik
        property: POSTGRESQL_USER
    - secretKey: POSTGRESQL_NAME
      remoteRef:
        key: homelab/kubernetes/authentik
        property: POSTGRESQL_NAME
    - secretKey: POSTGRESQL_PASSWORD
      remoteRef:
        key: homelab/kubernetes/authentik
        property: POSTGRESQL_PASSWORD

    - secretKey: REDIS_HOST
      remoteRef:
        key: homelab/kubernetes/authentik
        property: REDIS_HOST
    - secretKey: REDIS_PORT
      remoteRef:
        key: homelab/kubernetes/authentik
        property: REDIS_PORT
    - secretKey: REDIS_USERNAME
      remoteRef:
        key: homelab/kubernetes/authentik
        property: REDIS_USERNAME
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: homelab/kubernetes/authentik
        property: REDIS_PASSWORD
